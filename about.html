<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  /* applied before first paint so the page never flashes the wrong
     theme on load — the actual toggle logic lives in js/main.js */
  if (localStorage.getItem("theme") === "light") {
    document.documentElement.dataset.theme = "light";
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — Jaydon</title>
<meta name="description" content="About Jaydon — product designer working in interaction, visual, and brand design." />
<link rel="icon" href="assets/images/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/images/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=59" />
</head>
<body>

<div class="nav-wrap">
  <header class="nav container container--wide">
    <!-- logo + theme switch share the grid's first column so the bar
         stays a single row; see .nav__brand in style.css -->
    <div class="nav__brand">
      <a class="nav__logo" href="index.html" aria-label="Jaydon — home">
        <span class="nav__logo-badge"><img src="assets/images/nav-avatar.png" alt="" /></span>
      </a>
      <!-- light/dark switch. The CSS for this (.nav__theme-toggle and the
           sun/moon icon swap) already existed but no page ever rendered the
           button, so the theme could only be reached by hand-editing
           localStorage. -->
      <button class="nav__theme-toggle" id="themeToggle" aria-label="Switch colour theme" aria-pressed="false">
        <svg class="nav__theme-icon nav__theme-icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.4v2.3M12 19.3v2.3M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.4 12h2.3M19.3 12h2.3M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>
        <svg class="nav__theme-icon nav__theme-icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/>
        </svg>
      </button>
    </div>

    <!-- no .is-active / aria-current on either option: About me belongs to
         neither side of the Work/Play switch, so the pill stays unlit here
         (see .nav__switch-opt.is-active in style.css for the lit state) -->
    <div class="nav__switch">
      <a class="nav__switch-opt" href="index.html">Work</a>
      <a class="nav__switch-opt" href="digital-media.html">Play</a>
    </div>

    <ul class="nav__links" id="navLinks">
      <li><a href="about.html">About me</a></li>
      <li><a href="assets/resume.pdf" target="_blank" rel="noopener">Resume</a></li>
      <li><a href="mailto:wang.jaydon1@gmail.com">Contact</a></li>
    </ul>


    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 4H17M1 9H17M1 14H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </header>
</div>

<main>
  <!-- The only section on this page besides the footer. It is sized to
       exactly the space left below the nav (main.js -> sizeAboutHero),
       and every piece inside is placed against that box rather than laid
       out in flow — so the composition holds its shape at any viewport
       instead of reflowing part by part, and never needs a scrollbar.
       See .about-hero in style.css for how the placement works. -->
  <section class="about-hero">
    <div class="about-hero__grid" aria-hidden="true"></div>

    <div class="about-hero__inner container container--wide">
      <div class="about-hero__intro">
        <h1 class="hero__title about-hero__title" data-scramble>Heyy...</h1>
        <p class="about-hero__lede">What do you want to know</p>
      </div>

      <!-- Every stage piece sits in its own .about-hero__slot. The slot
           owns the position (and the -50% centering transform); the child
           owns the wiggle animation and its hover. One transform each, so
           they can't overwrite one another the way a single element
           carrying both would. -->
      <div class="about-hero__slot about-hero__slot--character">
        <img class="about-hero__character" src="assets/images/meditate-character.png"
             width="577" height="779" fetchpriority="high" decoding="async"
             alt="Illustration of Jaydon meditating" />
      </div>

      <!-- The three discs are placeholders: the art (record, sunflower,
           bin) isn't in assets/images yet, so they render as empty glass
           and don't navigate — same as the pair they replace. Drop an
           <img loading="lazy" decoding="async"> inside each one when the files land. -->
      <div class="about-hero__slot about-hero__slot--disc-top">
        <button class="about-hero__disc" type="button" aria-label="More coming soon"></button>
      </div>
      <div class="about-hero__slot about-hero__slot--disc-left">
        <button class="about-hero__disc" type="button" aria-label="More coming soon"></button>
      </div>
      <div class="about-hero__slot about-hero__slot--disc-right">
        <button class="about-hero__disc" type="button" aria-label="More coming soon"></button>
      </div>

      <!-- buttons, not links: neither destination exists yet -->
      <div class="about-hero__slot about-hero__slot--action-left">
        <button class="btn about-hero__action" type="button" aria-label="Biography — coming soon">Biography</button>
      </div>
      <div class="about-hero__slot about-hero__slot--action-right">
        <button class="btn about-hero__action" type="button" aria-label="My design ethos — coming soon">My design ethos</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <h2 class="reveal" data-scramble>Let's c*nnect!</h2>
    <div class="footer-links">
      <a class="btn" href="https://www.linkedin.com/in/jaydon-wang-26b677220/" target="_blank" rel="noopener">Linkedin</a>
      <a class="btn" href="mailto:wang.jaydon1@gmail.com">Email</a>
    </div>
    <p>© 2026 Jaydon. All rights reserved.</p>
  </div>
</footer>

<script src="js/main.js?v=59"></script>
<script src="js/scramble-text.js?v=59"></script>
</body>
</html>
